<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyWatch</title>
    <meta
      name="description"
      content="SkyWatch: a live 3D flight tracker with real ADS-B data, terrain, runways and NEXRAD weather radar."
    />
    <meta name="theme-color" content="#050608" />
    <meta property="og:title" content="SkyWatch" />
    <meta
      property="og:description"
      content="A live 3D flight tracker with real ADS-B data, terrain, runways and NEXRAD weather radar."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://flight-tracker.scottgrunerud98.workers.dev" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored/OS theme before first paint (mirrors src/core/theme.ts resolveTheme).
      try {
        var t = localStorage.getItem('tracon3d.theme')
        if (t !== 'dark' && t !== 'light')
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #050608;
        color: #e8edf2;
        font-family: 'IBM Plex Sans Condensed', sans-serif;
      }
      html[data-theme='light'],
      html[data-theme='light'] body,
      html[data-theme='light'] #root {
        background: #eef1f4;
        color: #16202a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
